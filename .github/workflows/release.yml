# 打 tag 即发版：构建 → 生成 build provenance 证明 → 创建 GitHub Release。
# 证明让使用者能验证 main.js 确实由本仓库这份源码构建：
#   gh attestation verify main.js --repo notesynchelper/edgeever-note-sync-helper
name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write # 建 Release
  id-token: write # 签 provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # tag 和 manifest 版本对不上就别发，免得用户装到版本号错位的包
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('../manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag != manifest.json $manifest" >&2
            exit 1
          fi

      # 手动跑（workflow_dispatch）只当构建冒烟，不签也不发
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            plugin/dist/main.js
            plugin/dist/manifest.json

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # EdgeEver 只下载 manifest.json 和 main.js（本插件没有 styles.css）。
          gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes
